<!-- Quick's checklist link page (settings 32–33). SOURCE — edit this, then run
     `node docs/build-list-page.js`, which drops the app's own checklist rules
     (utils/sharedDiff, ghostSlot, notesFormat, cardAccent, shareLabel) in at
     the APP_CORE slot and writes list.html (published to the quick-invite
     GitHub Pages repo). Evan, Nov 13: "i want the checklist to work exactly
     like the app. and have a nice design" — every size, colour and motion
     here is the app's (screens/checklist/*), and every change saves the
     app's way: sharedDiff.diffItems' ops → the invite-link edge function's
     list_op 'apply'. -->
<style>
  :root {
    --navy: #1B4F72;
    --accent: #3498DB;            /* the app's list accent when it has no look (utils/cardAccent) */
    --green: #27AE60;
    --gold: #F0A500;
    --red: #E74C3C;
    --ink: #2C3E50;
    --item: #444;
    --muted: rgba(27, 79, 114, 0.6);
    --hair: rgba(27, 79, 114, 0.12);
    --kb: 0px;                    /* the keyboard's height (visualViewport) */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #1B4F72 0%, #2C6A93 220px, #E9EFF5 220px);
    -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
  input, textarea { font: inherit; }
  .hidden { display: none !important; }

  /* ── the editor sheet (CDM 2005-2022) ── */
  .sheet {
    position: relative; max-width: 560px; margin: max(28px, env(safe-area-inset-top)) auto 0;
    background: #fff; border-radius: 24px 24px 0 0; padding: 12px 20px 140px;
    min-height: calc(100dvh - 28px); box-shadow: 0 -6px 30px rgba(11, 42, 64, .18);
    animation: rise 420ms cubic-bezier(.2, .9, .3, 1.1) both;
  }
  .sheet.view { padding-bottom: 36px; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(27, 79, 114, .18); margin: 0 auto 16px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .head h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--navy); }
  .who { font-size: 12.5px; font-weight: 700; color: var(--muted); text-align: right; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The field label (CDM 2049): a navy bar on its left. */
  .flabel {
    font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 1.2px;
    margin: 6px 0 8px; border-left: 3px solid var(--navy); padding-left: 8px; text-transform: uppercase;
  }
  .flabel.after { margin-top: 20px; }
  .titleRow { display: flex; align-items: center; margin-bottom: 4px; }
  .icon { width: 56px; height: 56px; border-radius: 28px; border: 2.5px solid transparent; display: flex; align-items: center; justify-content: center; margin-right: 10px; flex: none; }
  .icon i { width: 46px; height: 46px; border-radius: 23px; background: var(--accent); color: #fff; font-style: normal;
            font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .titleIn {
    flex: 1; min-width: 0; background: #F0F3F7; border-radius: 10px; padding: 12px 14px; font-size: 16px; color: var(--ink);
    border: 1px solid var(--hair); outline: none;
  }
  .titleIn::placeholder { color: #aaa; }
  .titleIn:focus { border-color: rgba(27, 79, 114, .45); background: #fff; }
  .titleTxt { font-size: 17px; font-weight: 700; color: var(--ink); word-break: break-word; }
  .vhint { font-size: 11px; font-style: italic; color: rgba(27, 79, 114, .5); margin: -2px 0 10px; }

  /* ── the progress bar (ProgressBar.js) ── */
  .prog { display: flex; align-items: center; margin: -2px 0 10px; }
  .track { position: relative; flex: 1; height: 10px; border-radius: 5px; background: rgba(27, 79, 114, .08); overflow: hidden; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: var(--accent);
          transition: width 520ms cubic-bezier(.34, 1.36, .64, 1), background-color 300ms; }
  .fill::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(255, 255, 255, .28); }
  .prog.full .fill { background: var(--green); }
  .sheen { position: absolute; top: 0; bottom: 0; left: -60px; width: 46px; background: rgba(255, 255, 255, .45); transform: skewX(-20deg); opacity: 0; }
  .sheen.go { animation: sheen 650ms ease-out; }
  @keyframes sheen { 0% { left: -60px; opacity: 1; } 100% { left: 100%; opacity: 1; } }
  .pill { width: 70px; margin-left: 10px; padding: 3px 0; border-radius: 10px; background: rgba(27, 79, 114, .08); text-align: center;
          font-size: 12px; font-weight: 800; color: rgba(27, 79, 114, .75); flex: none; }
  .pill.pop { animation: pillpop 420ms cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pillpop { from { transform: scale(.7); } to { transform: none; } }
  .prog.full .pill { background: rgba(39, 174, 96, .14); color: var(--green); }
  .prog.slim { margin: 0; }
  .prog.slim .track { height: 3px; border-radius: 1.5px; }
  .chips { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .chips span { background: rgba(27, 79, 114, .06); border-radius: 10px; padding: 4px 9px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .emptyMsg { font-size: 13px; font-style: italic; color: rgba(27, 79, 114, .5); padding: 6px 2px; }

  /* ── the items card + rows (CDM 2137-2163) ── */
  .card { border-radius: 16px; padding: 8px 10px; border-left: 3px solid var(--accent); background: rgba(52, 152, 219, .04); position: relative; }
  .card:empty { display: none; }
  .r { position: relative; display: flex; align-items: center; padding: 5px 0; border-radius: 8px;
       -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; will-change: transform; }
  .r.hid { display: none; }
  .r.star { background: rgba(255, 193, 7, .16); }
  .r.lift { z-index: 10; background: #fff; border-radius: 12px; box-shadow: 0 8px 14px rgba(11, 42, 64, .22); transform-origin: center; }
  .r.slide { transition: transform 260ms cubic-bezier(.25, 1.2, .5, 1); }
  .chk { flex: none; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #BDC3C7; margin-right: 12px;
         display: flex; align-items: center; justify-content: center; color: transparent; font-size: 11px; font-weight: 800; line-height: 1; }
  .r.done .chk { background: var(--green); border-color: var(--green); color: #fff; }
  .steps .chk { border-color: rgba(27, 79, 114, .3); }
  .view .chk { opacity: .4; }
  .view .r:not(.h) { padding: 7px 0; }
  .st { flex: none; padding: 5px 8px; margin-left: -8px; font-size: 17px; line-height: 1; color: #C6CED6; }
  .r.star .st { color: var(--gold); }
  .t { flex: 1; min-width: 0; position: relative; padding: 2px 0; cursor: pointer; }
  .tx { font-size: 14px; line-height: 19px; color: var(--item); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .steps .tx { color: var(--ink); }
  .r.done .tx { color: #bbb; text-decoration: line-through; }
  .t .prog { position: absolute; left: 0; right: 0; bottom: -3px; }
  .ren { width: 100%; font-size: 16px; color: var(--ink); border: 0; border-bottom: 1px solid var(--navy); padding: 1px 0 2px; outline: none; background: transparent; border-radius: 0; }
  .by { flex: none; width: 18px; height: 18px; border-radius: 9px; margin-left: 6px; border: 1.5px solid #fff; color: #fff;
        font-size: 9.5px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-sizing: content-box; }
  .dot { flex: none; width: 6px; height: 6px; border-radius: 3px; background: var(--navy); margin: 0 6px; }
  .x { flex: none; padding: 10px 12px; margin: -6px 0; font-size: 17px; font-weight: 600; color: var(--red); line-height: 1; }
  .hdl { flex: none; padding: 4px 8px; font-size: 18px; font-weight: 700; color: rgba(27, 79, 114, .45); line-height: 1; touch-action: pan-y; /* a swipe that starts on ☰ still scrolls, until the hold lifts it */ transition: transform 150ms; cursor: grab; }
  .hdl.held { transform: scale(1.35); }
  /* A section's header (HeaderRow.js). */
  .r.h { padding: 14px 0 6px; border-bottom: .5px solid #C9D4DD; border-radius: 0; }
  .view .r.h { padding: 10px 0 4px; }
  .chev { width: 24px; flex: none; text-align: center; font-size: 13px; font-weight: 700; color: var(--navy); }
  .ht { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; color: var(--navy); letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .view .ht { cursor: default; }
  .hc { font-size: 12px; font-weight: 700; color: #7F8C8D; margin-left: 8px; flex: none; }
  .hx { font-size: 15px; font-weight: 600; color: #B6BEC6; margin-left: 10px; padding: 6px 4px; flex: none; line-height: 1; }
  .r.h .ren { font-size: 15px; font-weight: 800; color: var(--navy); }
  /* The new item's ghost (ItemComposer GhostRow). */
  .r.g { border: 1.5px dashed rgba(52, 152, 219, .33); background: rgba(52, 152, 219, .08); border-radius: 10px; padding: 8px; margin: 3px 0; cursor: grab; touch-action: pan-y; }
  .r.g .chk { border: 2px dashed rgba(52, 152, 219, .55); }
  .gt { flex: 1; min-width: 0; font-size: 16px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gt.ph { color: #9AA6B2; }
  .caret { display: inline-block; width: 2px; height: 17px; background: var(--accent); vertical-align: -3px; margin: 0 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .foot { margin-top: 20px; text-align: center; font-size: 12.5px; font-weight: 600; color: rgba(27, 79, 114, .5); }
  .foot button { font-weight: 800; color: var(--navy); padding-left: 4px; }
  .brand { margin-top: 10px; text-align: center; font-size: 11px; font-weight: 800; color: rgba(27, 79, 114, .35); letter-spacing: 1.2px; }

  /* ── the composer, pinned under the list (ItemComposer.js) ── */
  .composer { position: fixed; left: 0; right: 0; bottom: var(--kb); z-index: 15; background: #fff;
              border-top: 1px solid rgba(27, 79, 114, .10); padding: 10px 16px max(12px, env(safe-area-inset-bottom)); }
  .composer > div { max-width: 520px; margin: 0 auto; }
  .bar { height: 50px; border-radius: 25px; background: #F4F7FA; border: 1.5px solid rgba(27, 79, 114, .10);
         display: flex; align-items: center; padding: 0 6px 0 14px; transition: background 150ms, border-color 150ms; }
  .bar.focus { background: #fff; border-color: rgba(27, 79, 114, .45); }
  .ring { width: 20px; height: 20px; border-radius: 10px; border: 2px solid rgba(27, 79, 114, .3); flex: none; margin-right: 10px; }
  .ring.pop { animation: ringpop 380ms cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes ringpop { from { transform: scale(.4); } to { transform: none; } }
  .bar input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; color: var(--ink); height: 100%; }
  .bar input::placeholder { color: #9AA6B2; }
  .hchip { height: 32px; padding: 0 11px; border-radius: 16px; border: 1.5px solid var(--navy); color: var(--navy); font-size: 12px; font-weight: 800; margin-right: 6px; flex: none; transition: opacity 150ms; }
  .plus { width: 38px; height: 38px; border-radius: 19px; background: var(--navy); color: #fff; font-size: 24px; font-weight: 500; line-height: 1; flex: none;
          display: flex; align-items: center; justify-content: center; transition: opacity 150ms, transform 200ms; }
  .plus i { font-style: normal; display: block; transition: transform 260ms; margin-top: -2px; }
  .plus.spin i { transform: rotate(90deg); }
  .bar.empty .hchip { opacity: .35; }
  .bar.empty .plus { opacity: .35; transform: scale(.85); }

  /* ── sheets (the item sheet, the name sheet) ── */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); opacity: 0; transition: opacity 220ms; z-index: 30; }
  .scrim.open { opacity: 1; }
  .isheet { position: fixed; left: 0; right: 0; bottom: var(--kb); z-index: 31; max-width: 560px; margin: 0 auto;
            background: #fff; border-radius: 24px 24px 0 0; transform: translateY(105%); transition: transform 280ms cubic-bezier(.2, .9, .3, 1);
            display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(11, 42, 64, .2); }
  .isheet.open { transform: none; }
  .isheet.tall { height: 85vh; height: calc(var(--vvh, 100dvh) * .85); }
  .isheet.short { max-height: 85vh; }
  .iscroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 20px 20px 16px; }
  .ifoot { padding: 8px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(27, 79, 114, .10); background: #fff; border-radius: 0; }
  .ifoot:empty { display: none; }
  /* ✕ sits ON the sheet's top edge (DoneButtons SheetClose). */
  .coin { position: absolute; top: -17px; left: 20px; width: 34px; height: 34px; border-radius: 17px; background: #fff; border: 1px solid var(--hair);
          box-shadow: 0 2px 6px rgba(11, 42, 64, .22); z-index: 2; }
  .coin::before, .coin::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 2.2px; border-radius: 1.1px; background: rgba(27, 79, 114, .7); }
  .coin::before { transform: translate(-50%, -50%) rotate(45deg); }
  .coin::after { transform: translate(-50%, -50%) rotate(-45deg); }
  .ihead { display: flex; align-items: center; margin-bottom: 14px; }
  .ihead h2 { flex: 1; min-width: 0; margin: 0 10px 0 0; font-size: 18px; font-weight: 700; color: var(--navy); line-height: 1.25;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .stog { width: 34px; height: 34px; border-radius: 17px; background: rgba(27, 79, 114, .06); margin-right: 12px; flex: none; font-size: 18px; color: rgba(27, 79, 114, .35); }
  .stog.on { background: rgba(240, 165, 0, .15); color: var(--gold); }
  .stog.pop { animation: pillpop 380ms cubic-bezier(.34, 1.56, .64, 1); }
  /* The Done pill (DoneButtons SheetDone). */
  .dpill { height: 34px; border-radius: 17px; background: var(--navy); color: #fff; display: flex; align-items: center; padding: 0 14px 0 6px; flex: none; }
  .dpill i { width: 22px; height: 22px; border-radius: 11px; background: #fff; color: var(--navy); font-style: normal; font-size: 13px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; margin-right: 7px; animation: pillpop 420ms 220ms cubic-bezier(.34, 1.56, .64, 1) both; }
  .dpill span { font-size: 14.5px; font-weight: 800; letter-spacing: .2px; }
  /* The notes paper (NotesPad.js). */
  .nlabel { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
  .nlabel b { font-size: 12px; font-weight: 700; color: #7F8C8D; letter-spacing: .5px; }
  .nlabel em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--accent); }
  .paper { position: relative; background: #FFFDF8; border-radius: 12px; border: 1px solid var(--hair); margin-bottom: 14px; overflow: hidden; transition: box-shadow 200ms; }
  /* Ruled lines every 24px, the first under the first line (y = 10 + 24(i+1) − 1). */
  .paper::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; bottom: 0; pointer-events: none; z-index: 0;
                  background-image: linear-gradient(to bottom, transparent 23px, rgba(27, 79, 114, .13) 23px, rgba(27, 79, 114, .13) 24px); background-size: 100% 24px; }
  .paper::before { content: ""; position: absolute; left: 26px; top: 0; bottom: 0; width: 1.5px; background: var(--accent); opacity: .35; transition: opacity 200ms; z-index: 0; }
  .paper .mirror, .paper textarea, .paper .vnote { z-index: 1; }
  .paper .vnote { position: relative; }
  .paper.writing { box-shadow: 0 4px 8px rgba(27, 79, 114, .08); }
  .paper.writing::before { opacity: .85; }
  .paper .mirror, .paper textarea {
    display: block; width: 100%; margin: 0; padding: 10px 14px 10px 36px; font-size: 16px; line-height: 24px; font-family: inherit;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; letter-spacing: 0;
  }
  .paper .mirror { position: absolute; inset: 0; color: var(--ink); pointer-events: none; overflow: hidden; }
  .paper .mirror .b { color: var(--accent); font-weight: 900; }
  .paper .mirror .ph { color: #A9B2BC; }
  .paper textarea { position: relative; min-height: 116px; border: 0; outline: none; background: transparent; resize: none; color: transparent; caret-color: var(--ink); overflow: hidden; }
  .paper.writing textarea { min-height: 216px; }
  .paper textarea::selection { background: rgba(52, 152, 219, .25); color: transparent; }
  .vnote { font-size: 16px; line-height: 24px; color: var(--ink); white-space: pre-wrap; padding: 10px 14px 10px 36px; }
  .dashed { border: 1.5px dashed rgba(27, 79, 114, .25); border-radius: 14px; padding: 14px; text-align: center; font-size: 13.5px; font-weight: 700; color: rgba(27, 79, 114, .55); cursor: pointer; }
  /* The notes toolbar (NotesToolbar.js). */
  .ntool { display: flex; align-items: center; gap: 8px; }
  .tbtn { width: 40px; height: 34px; border-radius: 11px; background: rgba(27, 79, 114, .08); border: 1px solid rgba(27, 79, 114, .18); color: var(--navy); font-size: 24px; font-weight: 900; line-height: 1; }
  .tbtn.on { background: rgba(52, 152, 219, .12); border-color: var(--accent); color: var(--accent); }
  .kdone { margin-left: auto; height: 34px; border-radius: 17px; padding: 0 14px; background: rgba(27, 79, 114, .08); border: 1px solid rgba(27, 79, 114, .18); color: var(--navy); font-size: 14.5px; font-weight: 800; }
  .kdone b { display: inline-block; transform: rotate(90deg); margin-right: 6px; font-weight: 800; }
  .pagein { animation: pagein 260ms cubic-bezier(.2, .9, .3, 1); }
  @keyframes pagein { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  .name .sub { margin: -4px 0 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .name input { width: 100%; background: #F0F3F7; border-radius: 10px; padding: 12px 14px; font-size: 16px; color: var(--ink); border: 1px solid var(--hair); outline: none; }
  .name input.shake { animation: shake 320ms; border-color: var(--red); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .toast { position: fixed; left: 50%; bottom: calc(var(--kb) + 92px); z-index: 50; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
           background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 999px; max-width: calc(100% - 32px); text-align: center;
           font-size: 14px; font-weight: 700; box-shadow: 0 10px 26px rgba(11, 42, 64, .28); transition: opacity 200ms, transform 200ms; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.show.act { pointer-events: auto; }
  .toast.act { display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 16px; }
  .toast .undo { background: rgba(255, 255, 255, .16); color: #fff; font-weight: 800; font-size: 14px; padding: 7px 14px; border-radius: 999px; }
  .msg { text-align: center; padding: 40px 10px 10px; }
  .msg .big { font-size: 40px; }
  .msg h1 { margin: 10px 0 6px; font-size: 21px; font-weight: 800; color: var(--navy); }
  .msg p { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--muted); line-height: 1.5; }
  .msg button { margin-top: 16px; padding: 10px 18px; border-radius: 999px; background: rgba(27, 79, 114, .08); color: var(--navy); font-weight: 800; }
  .skel { height: 14px; border-radius: 8px; background: linear-gradient(90deg, #EEF2F6, #F7F9FB, #EEF2F6); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 12px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<main class="sheet" id="sheet" aria-live="polite">
  <div class="grab"></div>
  <div class="skel" style="width: 40%; height: 18px;"></div>
  <div class="skel" style="width: 100%; height: 46px;"></div>
  <div class="skel" style="width: 100%; height: 120px;"></div>
</main>
<div class="composer hidden" id="composer"><div></div></div>
<div class="toast" id="toast" role="status"></div>

  // A change to the whole list: drawn now (moving rows glide — the app's

    next.forEach(function (i) { now[i.id] = i; });
    ops.forEach(function (o) {
      if (o.position != null) pos[o.op === "add" ? o.tempId : o.id] = o.position;
      // Steps go with the ones they started from, so the server lays only
      // THIS person's changes on what's there now (list_steps_merge).
      if (o.op === "update" && o.fields && o.fields.subItems && was[o.id]) o.fields.subBase = was[o.id].subItems || [];
      // A row put back (Undo) keeps its ★.

    });
    next = next.map(function (i) { return pos[i.id] != null ? Object.assign({}, i, { position: pos[i.id] }) : i; });

  // Every change asks their name first (once — this phone keeps it).
  function act(fn) { if (!S || !S.canEdit) return; askName(fn); }

  // ── one list's rows (the main list, and an item's steps) ──
  // get() → its rows; set(next) saves them. The same rules either way — the
  // app runs the steps on the very same code as the items.

  function rowsOf(ctl) {

  function measure(ctl) {

  }

  function byLetter(it) { return it.byMe ? "Y" : QC.initialOf(it.by); }
  function byColor(it) { var n = it.byMe ? "You" : it.by; return byLetter(it) === "?" ? "#B0B8C1" : QC.nameAccent(n); }

  function slimBar(d) {

  }

  // One row's HTML (CDM row + HeaderRow + GhostRow).
  function rowHtml(ctl, it, counts, hidden, view) {
    var id = esc(it.id);
    if (it.ghost) {
      var g = ctl.ghost.text;
      return '<div class="r g" data-id="' + id + '"><span class="chk"></span><span class="gt' + (g ? "" : " ph") + '">' +
        (g ? esc(g) + '<span class="caret"></span>' : '<span class="caret"></span>New item') + '</span></div>';
    }

        (view ? "" : '<button class="chev" data-a="chev" aria-label="Fold">' + (ctl.collapsed[it.id] ? "▸" : "▾") + '</button>') +
        '<span class="ht" data-a="hren">' + esc(it.text) + '</span>' +
        (c.total ? '<span class="hc">' + c.done + "/" + c.total + '</span>' : "") +
        (view ? "" : '<button class="hx" data-a="del" aria-label="Delete section">✕</button><span class="hdl" aria-label="Hold to move">☰</span>') +
        '</div>';

    var by = !ctl.steps && it.completed && (it.by || it.byMe) ? '<span class="by" style="background:' + byColor(it) + '" aria-label="Ticked by ' + esc(it.byMe ? "you" : it.by) + '">' + esc(byLetter(it)) + '</span>' : "";

      '<button class="chk" data-a="chk" aria-label="' + (it.completed ? "Untick" : "Tick") + '"' + (view ? " disabled" : "") + '>✓</button>' +
      (view ? "" : '<button class="st" data-a="star" aria-label="Star">' + (it.highlighted ? "★" : "☆") + '</button>') +
      '<div class="t" data-a="open"><div class="tx">' + esc(it.text) + '</div>' + (ctl.steps ? "" : slimBar(stepsDone(it))) + '</div>' +
      by + (detail ? '<span class="dot"></span>' : "") /* 🔒 too: there's something to read */ +
      (view ? "" : '<button class="x" data-a="del" aria-label="Delete">✕</button><span class="hdl" aria-label="Hold to move">☰</span>') +

  }

  function drawRows(ctl, before) {
    if (!ctl.card) return;
    if (ctl.noGlide) { ctl.noGlide = false; before = null; } // a drop already glided there
    var view = !S.canEdit;
    var rows = rowsOf(ctl);
    var counts = QC.sectionCounts(ctl.get());

    ctl.card.innerHTML = rows.map(function (it) {

      return rowHtml(ctl, it, counts, hiding && !it.ghost, view);

  }

  // Taps on a row: tick, ★, ✕, fold — and the text: tap = open, hold = rename.
  function wireCard(ctl) {
    ctl.card.addEventListener("click", function (e) {
      var b = e.target.closest("[data-a]"); if (!b || !S.canEdit || b.dataset.a === "open" || b.dataset.a === "hren") return;
      var row = b.closest(".r"); if (!row) return;
      var id = row.dataset.id, a = b.dataset.a;
      if (a === "chk") act(function () { tick(ctl, id); });
      else if (a === "star") act(function () { ctl.set(QC.starAndFloat(ctl.get(), id)); replay(b, "pop"); });
      else if (a === "del") act(function () {
        // Gone at once, like the app's ✕ — with 4 seconds to take it back.
        var list = ctl.get(), at = -1;
        for (var i = 0; i < list.length; i++) if (list[i].id === id) at = i;
        if (at < 0) return;
        var gone = list[at];

        toast("“" + (name.length > 24 ? name.slice(0, 23) + "…" : name) + "” deleted", function () {
          var now = ctl.get();

        });
      });

    });
    ctl.card.addEventListener("pointerdown", function (e) {
      // 🔒 view only: a tap still opens an item, to read it (no hold, no rename).
      var view = !S.canEdit;
      var t = e.target.closest(view ? '[data-a="open"]' : '[data-a="open"], [data-a="hren"]'); if (!t) return;
      var row = t.closest(".r"); var id = row.dataset.id;

  function find(ctl, id) { var l = ctl.get(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }

      var me = myName();
      next = next.map(function (x) { return x.id !== id ? x : Object.assign({}, x, x.completed ? { by: me, byMe: true } : { by: null, byMe: false }); });

  // Hold the text: rename it right there (empty = keep it).
  function renameInline(ctl, id) {

    input.value = it.text;

          ctl.collapsed = {};

          Array.prototype.forEach.call(ctl.card.querySelectorAll(".chev"), function (c) { c.textContent = "▾"; });

        row.style.transform = "translateY(" + target + "px)";

        setTimeout(function () {
          if (to === from) { cleanup(); drawRows(ctl); takeDeferred(); return; }
          var rows = rowsOf(ctl);
          var r = rows.splice(from, 1)[0]; rows.splice(to, 0, r);
          var split = QC.splitGhost(rows);
          if (split.afterId !== undefined) ctl.ghost.after = split.afterId;
          var changed = JSON.stringify(split.items.map(function (x) { return x.id; })) !== JSON.stringify(ctl.get().map(function (x) { return x.id; }));

  // ── the composer (ItemComposer.js) ──
  function composer(ctl, placeholder) {
    var wrap = document.createElement("div");
    wrap.innerHTML = '<div class="bar empty"><span class="ring"></span><input maxlength="500" placeholder="' + esc(placeholder) + '" enterkeyhint="done" autocomplete="off">' +
      '<button class="hchip" type="button">Header</button><button class="plus" type="button" aria-label="Add"><i>+</i></button></div>';
    var bar = wrap.firstChild, input = bar.querySelector("input");
    function sync() {
      var v = input.value;
      bar.classList.toggle("empty", !v.trim());
      var on = document.activeElement === input || !!v;
      ctl.ghost.text = v;
      if (on !== ctl.ghost.on) { ctl.ghost.on = on; drawRows(ctl); }
      else if (on) { var g = ctl.card && ctl.card.querySelector(".r.g .gt"); if (g) { g.className = "gt" + (v ? "" : " ph"); g.innerHTML = v ? esc(v) + '<span class="caret"></span>' : '<span class="caret"></span>New item'; } }
    }
    function add(header) {
      var text = input.value.replace(/\s+/g, " ").trim();
      if (!text) return;
      act(function () {
        // The app's addItem / addHeader (CDM 672-697): an item lands at the
        // ghost; a header at the ghost only if it was dragged somewhere, else
        // at the very END. A dragged-to spot then follows the new row.
        var row = header ? { id: ctl.newId(), text: text, header: true } : { id: ctl.newId(), text: text, completed: false };
        var list = ctl.get();
        var next = header && !ctl.ghost.after ? list.concat([row]) : QC.insertAtGhost(list, ctl.ghost.after, row);
        if (ctl.ghost.after) ctl.ghost.after = row.id;
        input.value = "";
        replay(bar.querySelector(".ring"), "pop");
        var p = bar.querySelector(".plus"); p.classList.toggle("spin");
        ctl.set(next);
        sync();
        input.focus();
      });
    }
    input.addEventListener("input", sync);
    input.addEventListener("focus", function () { bar.classList.add("focus"); sync(); });
    input.addEventListener("blur", function () { bar.classList.remove("focus"); setTimeout(sync, 0); });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); add(false); } });
    bar.querySelector(".plus").addEventListener("mousedown", function (e) { e.preventDefault(); });
    bar.querySelector(".hchip").addEventListener("mousedown", function (e) { e.preventDefault(); });
    bar.querySelector(".plus").addEventListener("click", function () { add(false); });
    bar.querySelector(".hchip").addEventListener("click", function () { add(true); });
    return { el: bar, input: input };
  }

  // ── the page ──
  var built = false, mainComposer = null;
  function build() {

    var sh = $("sheet");

      '<div class="grab"></div>' +
      '<div class="head"><h1 id="htitle"></h1><span class="who" id="who"></span></div>' +
      '<div class="flabel">Title</div>' +
      '<div class="titleRow" id="titleRow"></div>' +
      '<div class="flabel after" id="ilabel"></div>' +
      '<div class="vhint hidden" id="vhint">You can’t change this list — you can only look.</div>' +
      '<div class="prog hidden" id="prog"><div class="track"><div class="fill" id="fill"></div><i class="sheen" id="sheen"></i></div><div class="pill" id="pill"></div></div>' +
      '<div class="chips hidden" id="chips"><span>📝 Tap for notes</span><span>✏️ Hold to rename</span></div>' +

      '<div class="card" id="card"></div>' +
      '<div class="foot" id="foot"></div>' +

    else {

      var tin = $("tin"), titleT = null;
      // The name, like the app's TITLE: saved on Enter, on leaving it, and a
      // moment after typing stops. Their name is asked first, not after.
      function saveTitle() {
        clearTimeout(titleT);
        var v = tin.value.replace(/\s+/g, " ").trim();
        if (!v || v === S.title) return;
        S.title = v; $("letter").textContent = QC.initialOf(v); document.title = v + " · Quick";
        send("rename", { title: v });
      }
      tin.addEventListener("focus", function () {
        if (!myName()) { tin.blur(); askName(function () { tin.focus(); }); return; }
        busy.edit = true;
      });
      tin.addEventListener("input", function () { clearTimeout(titleT); titleT = setTimeout(saveTitle, 1500); });
      tin.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); tin.blur(); } });
      tin.addEventListener("blur", function () {
        busy.edit = false;
        if (!tin.value.trim()) { clearTimeout(titleT); tin.value = S.title; return; }
        saveTitle();
      });
      mainComposer = composer(mainCtl, "Add an item…");
      $("composer").firstChild.innerHTML = ""; $("composer").firstChild.appendChild(mainComposer.el);
    }
    $("composer").classList.toggle("hidden", view);
  }

  var lastDone = -1;
  function render(before) {
    if (!S || S.off) {
      built = false; $("composer").classList.add("hidden");
      $("sheet").innerHTML = '<div class="grab"></div><div class="msg"><div class="big">🔗</div><h1>This link is off</h1><p>Whoever sent it turned it off. Ask them for a new one.</p></div><div class="brand">QUICK</div>';
      return;
    }
    if (!built || $("sheet").classList.contains("view") !== !S.canEdit) { built = false; build(); }
    var view = !S.canEdit;
    document.title = S.title + " · Quick";
    $("htitle").textContent = view ? "Checklist" : "Edit Checklist";
    $("who").textContent = S.host ? "Shared by " + firstName(S.host) : "";
    if (view) $("ttext").textContent = S.title;
    else {
      if (document.activeElement !== $("tin")) $("tin").value = S.title;
      $("letter").textContent = QC.initialOf(S.title);
    }
    var real = QC.countableItems(items);
    var done = real.filter(function (i) { return i.completed; }).length;
    var full = QC.isListComplete(items);
    $("ilabel").textContent = "Items  (" + done + "/" + real.length + ")";
    $("vhint").classList.toggle("hidden", !view);
    // Taken off the link by the sharer (settings 34): they can still look.
    $("vhint").textContent = S.removed ? firstName(S.host) + " took you off this list — you can still look." : "You can’t change this list — you can only look.";
    // The bar: shown with at least one real item (never in the locked view).
    var prog = $("prog");
    prog.classList.toggle("hidden", view || !real.length);
    prog.classList.toggle("full", full);
    $("fill").style.width = (real.length ? Math.round(done * 100 / real.length) : 0) + "%";
    var pill = $("pill"), label = full ? "🎉 Done" : done + "/" + real.length;
    if (pill.textContent !== label) { if (pill.textContent) replay(pill, "pop"); pill.textContent = label; }
    if (lastDone >= 0 && done > lastDone) replay($("sheen"), "go");
    lastDone = done;
    $("chips").classList.toggle("hidden", view || !items.length);
    var empty = $("empty");
    empty.classList.toggle("hidden", items.length > 0 || (!view && mainCtl.ghost.on));
    empty.textContent = view ? "No items yet." : "No items yet — add your first below.";
    drawRows(mainCtl, before);
    var nm = myName();
    $("foot").innerHTML = !view && nm ? "Changing it as " + esc(nm) + " ·<button id=\"notyou\">Not you?</button>" : "";
    var ny = $("notyou"); if (ny) ny.onclick = function () { askName(function () { render(); }, true); };
  }

  // ── sheets ──
  var sheet = null;
  // onCancel (✕ / tapping outside): return false to stay open. z: stacked
  // over another sheet (the name, over an item).
  function openSheet(cls, build, onCancel, z) {
    busy.sheet = true;
    document.body.classList.add("locked");
    var scrim = document.createElement("div"); scrim.className = "scrim";
    var el = document.createElement("div"); el.className = "isheet " + cls; el.setAttribute("role", "dialog");
    if (z) { scrim.style.zIndex = z - 1; el.style.zIndex = z; }
    el.innerHTML = '<button class="coin" aria-label="Cancel"></button><div class="iscroll"></div><div class="ifoot"></div>';
    document.body.appendChild(scrim); document.body.appendChild(el);
    requestAnimationFrame(function () { scrim.classList.add("open"); el.classList.add("open"); });
    var me = { el: el, body: el.querySelector(".iscroll"), foot: el.querySelector(".ifoot"), refresh: null, closing: false };
    me.close = function () {
      if (me.closing) return; me.closing = true;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      scrim.classList.remove("open"); el.classList.remove("open");
      setTimeout(function () { scrim.remove(); el.remove(); }, 300);
      document.body.classList.remove("locked");
      busy.sheet = false;
      if (sheet === me) sheet = null;
      render();
    };
    me.cancel = function () { if (onCancel && onCancel() === false) return; me.close(); };
    // A tap outside does nothing — only ✕ and Done close it, like the app (and
    // an iPhone's second "click" after the tap that opened it lands here).
    el.querySelector(".coin").addEventListener("click", me.cancel);
    sheet = me;
    build(me);
    return me;
  }

  // Their name, once (the app knows who you are; a link has to ask).
  function askName(then, force) {
    var have = myName();
    if (have && !force) { then(have); return; }
    var prev = sheet;
    var s = openSheet("short name", function (s) {
      s.body.innerHTML = '<div class="ihead"><h2>' + (force ? "Your name" : "What's your name?") + '</h2><button class="dpill" id="nmok"><i>✓</i><span>Done</span></button></div>' +
        '<p class="sub">So ' + esc(S && S.host ? firstName(S.host) : "they") + ' sees who changed it.</p><input id="nm" maxlength="40" autocomplete="given-name" placeholder="Your name" enterkeyhint="done">';
      var input = s.el.querySelector("#nm"); input.value = have;
      // Focused now, while the tap that asked is still going (iOS raises the
      // keyboard only then) — and once more after the slide, to be sure.
      try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
      setTimeout(function () { if (document.activeElement !== input) { try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); } } }, 300);
      function go() {
        var v = input.value.replace(/\s+/g, " ").trim().slice(0, 40);
        if (!v) { input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake"); input.focus(); return; }
        store("quick-invite-name", v);
        s.close();
        if (prev && !prev.closing) { sheet = prev; busy.sheet = true; document.body.classList.add("locked"); }
        then(v);
      }
      s.el.querySelector("#nmok").addEventListener("click", go);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
    }, function () {
      // ✕ on the name: back to the sheet under it, if there was one.
      setTimeout(function () { if (prev && !prev.closing) { sheet = prev; busy.sheet = true; document.body.classList.add("locked"); } }, 0);
    }, 41);
  }

  // ── an item's sheet (ItemDetailSheet): name, ★, Done · NOTES · SUB-ITEMS ──
  function itemOf(id) { for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; return null; }
  function setItem(id, patch) { commit(items.map(function (x) { return x.id === id ? Object.assign({}, x, patch) : x; })); }
  function openItem(id) {
    var it0 = itemOf(id); if (!it0) return;
    var snap = { notes: it0.notes || "", highlighted: !!it0.highlighted };
    // What THIS person changed here — ✕ takes back only that (anyone else's
    // changes since stay): their step changes, and whether they touched the
    // notes or the ★.
    var mySteps = [], touched = { notes: false, star: false };
    var stepCtl = new Ctl({
      steps: true, newId: stepId,
      get: function () { var it = itemOf(id); return it ? (it.subItems || []) : []; },
      set: function (next) { mySteps.push({ prev: stepCtl.get(), next: next }); setItem(id, { subItems: next }); },
      onOpen: function (st) { openStepPage(st.id); },
    });
    var page = null; // a step's notes page (its id), or null
    var pageMark = 0; // how many step changes there were when it opened
    var writing = false, pad = null, stepComposer = null;
    var s = openSheet("tall", function (me) {
      s = me; // draw() below reads it — openSheet hasn't returned yet
      stepCtl.scroller = s.body;
      s.refresh = function () { if (!itemOf(id)) { s.close(); toast(ERR.gone); return; } if (!writing) draw(); };
      draw();
    }, function cancel() {
      // ✕ on a step's page: back to the item, the step as it was.
      if (page) { closeStepPage(true); return false; }
      // ✕ keeps nothing of mine: the item as it was when it opened (cancelItem).
      if (pad) pad.drop();
      var it = itemOf(id); if (!it) return;
      var patch = {};
      if (touched.notes && (it.notes || "") !== snap.notes) patch.notes = snap.notes;
      if (touched.star && !!it.highlighted !== snap.highlighted) patch.highlighted = snap.highlighted;
      if (Object.keys(patch).length) setItem(id, patch);
      takeBackSteps(0);
    });
    // My step changes since `from`, taken back newest first — each one laid on
    // what's there now by the server (list_steps_merge), so nobody else's go.
    function takeBackSteps(from) {
      var mine = mySteps.slice(from); mySteps.length = from;
      if (!mine.length) return;
      var ops = mine.slice().reverse().map(function (c) { return { op: "update", id: id, fields: { subItems: c.prev, subBase: c.next } }; });
      var before = measure(mainCtl);
      items = items.map(function (x) { return x.id === id ? Object.assign({}, x, { subItems: mine[0].prev }) : x; });
      render(before);
      if (sheet && sheet.refresh) sheet.refresh();
      send("apply", { ops: ops });
    }

    function draw() {
      var it = itemOf(id); if (!it) return;
      var b = s.body, view = !S.canEdit;
      if (page) return drawStepPage(it);
      var d = stepsDone(it);
      var steps = (it.subItems || []).length;
      b.innerHTML =
        '<div class="ihead"><h2 id="iname"></h2>' +
        (view ? (it.highlighted ? '<span class="stog on">★</span>' : "") : '<button class="stog' + (it.highlighted ? " on" : "") + '" id="istar" aria-label="Star">' + (it.highlighted ? "★" : "☆") + '</button>') +
        '<button class="dpill" id="idone"><i>✓</i><span>Done</span></button></div>' +
        '<div id="padslot"></div>' +
        (view && !steps ? "" :
          '<div id="subs"><div class="flabel">Sub-items  (' + d.done + "/" + d.total + ')</div>' +
          (d.total && !view ? '<div class="prog' + (d.done === d.total ? " full" : "") + '"><div class="track"><div class="fill" style="width:' + Math.round(d.done * 100 / d.total) + '%"></div></div><div class="pill">' + (d.done === d.total ? "🎉 Done" : d.done + "/" + d.total) + '</div></div>' : "") +
          (view ? "" : steps ? '<div class="chips"><span>📝 Tap for notes</span><span>✏️ Hold to rename</span></div>' : '<div class="dashed" id="breakup">🪜  Break this item into smaller steps</div>') +
          '<div class="card steps" id="scard"></div></div>') +
        (view && !steps && !it.notes ? '<p class="emptyMsg">Nothing more on this one.</p>' : "");
      b.querySelector("#iname").textContent = it.text;
      // ★ here just stars it (the app's StarToggle → onUpdate({ highlighted })).
      var star = b.querySelector("#istar");
      if (star) star.addEventListener("click", function () { var me = this; act(function () { touched.star = true; setItem(id, { highlighted: !itemOf(id).highlighted }); replay(me, "pop"); }); });
      b.querySelector("#idone").addEventListener("click", function () { if (pad) pad.save(); s.close(); });
      pad = notesPad(b.querySelector("#padslot"), function () { return itemOf(id).notes || ""; }, function (v) { touched.notes = true; setItem(id, { notes: v }); }, setWriting);
      stepCtl.card = b.querySelector("#scard");
      if (stepCtl.card) { wireCardOnce(stepCtl); drawRows(stepCtl); }
      var bu = b.querySelector("#breakup"); if (bu) bu.addEventListener("click", function () { stepComposer && stepComposer.input.focus(); });
      drawFoot();
    }
    // The add bar — the item's page only (not a step's page), and only for
    // someone who can change it.
    function drawFoot() {
      if (writing) return;
      if (page || !S.canEdit) { s.foot.innerHTML = ""; return; }
      if (!stepComposer) stepComposer = composer(stepCtl, "Add a sub-item…");
      // Left in place if it's there (moving it would drop the keyboard).
      if (stepComposer.el.parentNode !== s.foot) { s.foot.innerHTML = ""; s.foot.appendChild(stepComposer.el); }
    }
    // While notes are written, the steps and their bar step aside (the app's).
    function setWriting(on) {
      writing = on;
      var subs = s.body.querySelector("#subs"); if (subs) subs.classList.toggle("hidden", on);
      if (on) {
        s.foot.innerHTML = '<div class="ntool"><button class="tbtn" id="bul" aria-label="Bullet">•</button><button class="kdone" id="kdone"><b>›</b>Done</button></div>';
        s.foot.querySelector("#bul").addEventListener("mousedown", function (e) { e.preventDefault(); });
        s.foot.querySelector("#bul").addEventListener("click", function () { pad && pad.bullet(); });
        s.foot.querySelector("#kdone").addEventListener("mousedown", function (e) { e.preventDefault(); });
        s.foot.querySelector("#kdone").addEventListener("click", function () { pad && pad.save(); });
      } else { s.foot.innerHTML = ""; drawFoot(); }
    }
    // A step's own page: its name, its ★, Done — and its notes.
    function openStepPage(stepIdv) {
      // 🔒 view only: a step's page opens only when there's a note to read.
      if (!S.canEdit) { var st0 = stepCtl.get().filter(function (x) { return x.id === stepIdv; })[0]; if (!st0 || !st0.notes) return; }
      page = stepIdv; pageMark = mySteps.length;
      draw();
      s.body.firstChild && s.body.classList.add("pagein");
      setTimeout(function () { s.body.classList.remove("pagein"); }, 300);
    }
    function closeStepPage(cancel) {
      if (pad) { if (cancel) pad.drop(); else pad.save(); }
      // ✕: the step's changes made on its page go back (only mine).
      if (cancel) takeBackSteps(pageMark);
      page = null; writing = false;
      draw();
    }
    function drawStepPage(it) {
      var st = (it.subItems || []).filter(function (x) { return x.id === page; })[0];
      if (!st) { page = null; return draw(); }
      var b = s.body, view = !S.canEdit;
      b.innerHTML = '<div class="ihead"><h2 id="sname"></h2>' +
        (view ? (st.highlighted ? '<span class="stog on">★</span>' : "") : '<button class="stog' + (st.highlighted ? " on" : "") + '" id="sstar" aria-label="Star">' + (st.highlighted ? "★" : "☆") + '</button>') +
        '<button class="dpill" id="sdone"><i>✓</i><span>Done</span></button></div><div id="padslot"></div>';
      b.querySelector("#sname").textContent = st.text;
      var sstar = b.querySelector("#sstar");
      if (sstar) sstar.addEventListener("click", function () {
        var me = this;
        act(function () { stepCtl.set(QC.starAndFloat(stepCtl.get(), page)); replay(me, "pop"); });
      });
      b.querySelector("#sdone").addEventListener("click", function () { closeStepPage(false); });
      pad = notesPad(b.querySelector("#padslot"),
        function () { var x = (itemOf(id).subItems || []).filter(function (y) { return y.id === page; })[0]; return (x && x.notes) || ""; },
        function (v) { stepCtl.set(stepCtl.get().map(function (y) { return y.id === page ? Object.assign({}, y, { notes: v }) : y; })); },
        setWriting);
      if (!writing) { s.foot.innerHTML = ""; }
    }
  }
  // The step card's taps are wired once per card element.
  function wireCardOnce(ctl) { if (ctl.card && !ctl.card.dataset.wired) { ctl.card.dataset.wired = "1"; wireCard(ctl); } }

  // ── the notes paper (NotesPad.js): ruled, a margin line, • bullets ──
  // The text runs through the app's own notesFormat (typed / pressEnter /
  // cycleBullet), so bullets carry on and step back exactly like the app's.
  function notesPad(slot, getText, save, onWriting) {
    var view = !S.canEdit;
    var text = getText();
    if (view) {
      slot.innerHTML = text ? '<div class="nlabel"><b>NOTES</b></div><div class="paper"><div class="vnote"></div></div>' : "";
      if (text) slot.querySelector(".vnote").textContent = text;
      return { save: function () {}, drop: function () {}, bullet: function () {} };
    }
    slot.innerHTML = '<div class="nlabel"><b>NOTES</b><em class="hidden">✏️  Done saves</em></div>' +
      '<div class="paper"><div class="mirror"></div><textarea spellcheck="true" maxlength="4000"></textarea></div>';
    var paper = slot.querySelector(".paper"), ta = paper.querySelector("textarea"), mirror = paper.querySelector(".mirror"), hint = slot.querySelector("em");
    var state = { text: text, sel: { start: text.length, end: text.length }, bold: [] };
    var writing = false;
    ta.value = text;
    function paint() {
      var t = state.text;
      if (!t) { mirror.innerHTML = '<span class="ph">' + (writing ? "Write notes, research, what you actually have to do…" : "Tap to write notes, research, what you actually have to do…") + "</span>"; }
      else {
        mirror.innerHTML = t.split("\n").map(function (line) {
          var b = QC.bulletOf(line);
          if (!b.level) return esc(line);
          var pre = line.slice(0, b.len), glyph = b.level === 2 ? "◦" : "•", at = pre.indexOf(glyph);
          return esc(pre.slice(0, at)) + '<span class="b">' + glyph + "</span>" + esc(pre.slice(at + 1)) + esc(line.slice(b.len));
        }).join("\n") + "\n";
      }
      ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight, writing ? 216 : 116) + "px";
    }
    function apply(next) {
      state = next;
      ta.value = next.text;
      try { ta.setSelectionRange(next.sel.start, next.sel.end); } catch (e) { /* ok */ }
      paint();
    }
    ta.addEventListener("focus", function () {
      if (!S.canEdit) { ta.blur(); return; }
      // Their name FIRST — asked when they finished, a cancel lost the notes.
      if (!myName()) { ta.blur(); askName(function () { ta.focus(); }); return; }
      writing = true; paper.classList.add("writing"); hint.classList.remove("hidden"); busy.edit = true;
      onWriting && onWriting(true); paint();
    });
    // Saved a moment after typing stops too — not only on leaving the paper
    // (switching apps or closing the tab mid-note lost it).
    var autoT = null;
    function autosave() { clearTimeout(autoT); autoT = setTimeout(function () { if (!dropped && S.canEdit && state.text !== getText()) save(state.text); }, 1200); }
    ta.addEventListener("input", function () {
      apply(QC.typed(state, ta.value, false));
      autosave();
    });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        state.sel = { start: ta.selectionStart, end: ta.selectionEnd };
        apply(QC.pressEnter(state));
      }
    });
    ta.addEventListener("select", function () { state.sel = { start: ta.selectionStart, end: ta.selectionEnd }; });
    ta.addEventListener("keyup", function () { state.sel = { start: ta.selectionStart, end: ta.selectionEnd }; });
    ta.addEventListener("click", function () { state.sel = { start: ta.selectionStart, end: ta.selectionEnd }; });
    var dropped = false;
    ta.addEventListener("blur", function () {
      clearTimeout(autoT);
      var was = writing;
      writing = false; paper.classList.remove("writing"); hint.classList.add("hidden"); if (was) busy.edit = false;
      paint();
      if (!dropped && state.text !== getText()) act(function () { save(state.text); });
      if (was) onWriting && onWriting(false);
    });
    paint();
    return {
      save: function () { ta.blur(); },
      drop: function () { dropped = true; ta.blur(); },
      bullet: function () { state.sel = { start: ta.selectionStart, end: ta.selectionEnd }; apply(QC.cycleBullet(state)); ta.focus(); },
    };
  }

  // ── go ──
  if (!token) { S = { off: true }; render(); return; }
  load().catch(function () {
    $("sheet").innerHTML = '<div class="grab"></div><div class="msg"><div class="big">📶</div><h1>No connection</h1><p>Check your signal and try again.</p><button onclick="location.reload()">Try again</button></div>';
  });
  // Live: what others change shows up here (not mid-change).
  setInterval(function () { if (!document.hidden && S && !S.off && !quiet()) load().catch(function () {}); }, POLL_MS);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { flush(); return; }
    if (S && !S.off && !quiet()) load().catch(function () {});
  });
  // Leaving the page (another app, the tab closing): whatever's being typed —
  // notes, a rename, the title — is saved now (leaving the box saves it).
  function flush() {
    var a = document.activeElement;
    if (a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !a.closest(".bar")))) a.blur();
  }
  window.addEventListener("pagehide", flush);
})();
</script>
</body>
</html>
